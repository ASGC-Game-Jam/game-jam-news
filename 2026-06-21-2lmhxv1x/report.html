<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1f2328; --muted:#636c76; --accent:#5865f2; --rule:#e3e1dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --card:#1f2024; --ink:#e6e6e6; --muted:#9ba1a6; --accent:#8b95ff; --rule:#33353a; }
  }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:17px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:720px; margin:32px auto; padding:32px 40px; background:var(--card); border-radius:12px; }
  @media (max-width:760px) { main { margin:0; padding:20px 16px; border-radius:0; } }
  h1 { font-size:2rem; line-height:1.2; margin:0 0 4px; }
  h1 + p em { color:var(--muted); font-style:normal; font-size:.95rem; }
  h2 { margin-top:2.2em; padding-bottom:6px; border-bottom:2px solid var(--rule); }
  a { color:var(--accent); }
  img { max-width:100%; border-radius:8px; display:block; margin:16px 0 4px; }
  img + em, p > em:only-child { color:var(--muted); font-size:.9rem; }
  blockquote { margin:16px 0; padding:8px 16px; border-left:4px solid var(--accent);
               background:color-mix(in srgb, var(--accent) 7%, transparent); border-radius:0 8px 8px 0; }
  hr { border:0; border-top:1px solid var(--rule); margin:32px 0; }
</style>
</head>
